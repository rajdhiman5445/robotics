      const STACK_KEY = 'robotics-nav-stack';
      const RECENTS_KEY = 'robotics-recent-pages-v1';
      const MAX_STACK = 30;
      const MAX_RECENTS = 5;

      const readStack = () => {
        try {
          const raw = sessionStorage.getItem(STACK_KEY);
          const parsed = raw ? JSON.parse(raw) : [];
          return Array.isArray(parsed) ? parsed.filter((entry) => typeof entry === 'string') : [];
        } catch {
          return [];
        }
      };

      const writeStack = (stack) => {
        try {
          sessionStorage.setItem(STACK_KEY, JSON.stringify(stack.slice(-MAX_STACK)));
        } catch {
          // Ignore storage failures.
        }
      };

      const readRecents = () => {
        try {
          const raw = localStorage.getItem(RECENTS_KEY);
          const parsed = raw ? JSON.parse(raw) : [];
          return Array.isArray(parsed)
            ? parsed
                .filter((entry) => entry && typeof entry === 'object' && typeof entry.href === 'string')
                .map((entry) => ({
                  href: entry.href,
                  title: typeof entry.title === 'string' ? entry.title : typeof entry.label === 'string' ? entry.label : 'Page',
                  path: typeof entry.path === 'string' ? entry.path : '',
                  kind:
                    entry.kind === 'navigator' || entry.kind === 'utility'
                      ? entry.kind
                      : 'document',
                  timestamp:
                    typeof entry.timestamp === 'number' ? entry.timestamp : Date.now(),
                }))
            : [];
        } catch {
          return [];
        }
      };

      const writeRecents = (items) => {
        try {
          localStorage.setItem(RECENTS_KEY, JSON.stringify(items.slice(0, MAX_RECENTS)));
        } catch {
          // Ignore storage failures.
        }
      };

      const currentHref = () => `${window.location.pathname}${window.location.search}`;
      const normalizeHref = (href) => {
        if (!href) return '';
        try {
          const url = new URL(href, window.location.origin);
          return `${url.pathname}${url.search}`;
        } catch {
          return href;
        }
      };

      const pushCurrent = () => {
        const stack = readStack();
        const current = currentHref();
        if (stack[stack.length - 1] !== current) {
          stack.push(current);
          writeStack(stack);
        }
      };

      const recordRecent = () => {
        const href = normalizeHref(document.body.dataset.wikiPageHref || currentHref());
        const title = document.body.dataset.wikiPageTitle || document.title.replace(/\s*·\s*Robotics Wiki\s*$/, '').trim();
        const path = document.body.dataset.wikiPagePath || '';
        const kind = document.body.dataset.wikiPageKind || 'document';

        if (!href || kind !== 'document') return;

        const items = readRecents().filter((item) => item.href !== href);
        items.unshift({
          href,
          title: title || 'Page',
          path,
          kind,
          timestamp: Date.now(),
        });
        writeRecents(items);
        window.__wikiRecentPages = items;
      };

      window.__wikiNavigate = (href) => {
        if (!href) return;
        if (href === currentHref()) return;
        pushCurrent();
        window.location.assign(href);
        return true;
      };

      window.__wikiGoBack = () => {
        const stack = readStack();
        const target = stack.pop();
        if (!target) return false;
        writeStack(stack);
        window.location.assign(target);
        return true;
      };

      window.__wikiGetRecentPages = () => readRecents();

      const isTypingTarget = (target) => {
        if (!(target instanceof HTMLElement)) return false;
        if (target.isContentEditable) return true;
        const tag = target.tagName;
        return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
      };

      window.addEventListener(
        'click',
        (event) => {
          if (event.defaultPrevented) return;
          if (event.button !== 0) return;
          if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;

          const target = event.target;
          const anchor = target instanceof Element ? target.closest('a[href]') : null;
          if (!anchor) return;
          if (anchor.getAttribute('target') === '_blank') return;

          const href = anchor.getAttribute('href');
          if (!href || href.startsWith('#')) return;

          const url = new URL(href, window.location.origin);
          if (url.origin !== window.location.origin) return;
          if (url.pathname === window.location.pathname && url.search === window.location.search && url.hash) return;

          event.preventDefault();
          window.__wikiNavigate(`${url.pathname}${url.search}`);
        },
        true,
      );

      window.addEventListener('keydown', (event) => {
        if (event.defaultPrevented) return;
        if (event.ctrlKey && event.code === 'KeyK') {
          event.preventDefault();
          window.__wikiToggleCommandPalette?.();
          return;
        }

        if (event.metaKey || event.ctrlKey) return;

        const target = event.target;
        const typing = isTypingTarget(target);

        const slashShortcut = event.key === '/' && !event.altKey;
        const altSlashShortcut = event.altKey && event.code === 'Slash';

        if (!slashShortcut && !altSlashShortcut) return;
        if (typing && !altSlashShortcut) return;

        event.preventDefault();
        window.__wikiNavigate('/search/');
      });

      window.addEventListener('DOMContentLoaded', () => {
        recordRecent();
      });

core idea in robotics ## core idea the determinant tells you whether a linear map preserves orientation and how it scales volume. in robotics singular transforms invertibility checks frame consistency"},{"title":"Eigenvalues","href":"/concepts/linear-algebra/eigenvalues/","path":"Concepts → Concepts → Linear Algebra → Eigenvalues","section":"Concepts","tags":["math"],"searchText":"eigenvalues characteristic scalars that reveal system modes and stability. math core idea in robotics ## core idea eigenvalues describe how a system stretches or contracts along special directions. in robotics stability analysis modal behavior covariance structure"},{"title":"SVD","href":"/concepts/linear-algebra/svd/","path":"Concepts → Concepts → Linear Algebra → SVD","section":"Concepts","tags":["math"],"searchText":"svd a factorization that separates structure, scale, and rank. math core idea in robotics ## core idea singular value decomposition decomposes a matrix into rotations and axis-aligned scaling. in robotics rank analysis point cloud alignment low-rank approximation"},{"title":"Least Squares","href":"/concepts/linear-algebra/least-squares/","path":"Concepts → Concepts → Linear Algebra → Least Squares","section":"Concepts","tags":["estimation"],"searchText":"least squares a method for fitting models to noisy measurements. estimation core idea in robotics ## core idea least squares finds the model parameters that minimize the sum of squared residuals. in robotics calibration sensor fitting trajectory smoothing"},{"title":"Probability","href":"/concepts/probability/overview/","path":"Concepts → Concepts → Probability → Overview","section":"Concepts","tags":["statistics","robotics"],"searchText":"probability a language for uncertainty, belief, and inference. statistics robotics why this exists roadmap related topics ## why this exists robotics systems operate under uncertainty. probability gives a way to model that uncertainty without pretending the sensors are perfect. roadmap work through random variables, gaussian models, and bayes' rule before moving into estimation. related topics linear algebra state estimation"},{"title":"Random Variables","href":"/concepts/probability/random-variables/","path":"Concepts → Concepts → Probability → Random Variables","section":"Concepts","tags":["statistics"],"searchText":"random variables variables whose values are uncertain and described by distributions. statistics core idea ## core idea a random variable maps outcomes to numbers and lets you reason about uncertainty mathematically."},{"title":"Gaussian","href":"/concepts/probability/gaussian/","path":"Concepts → Concepts → Probability → Gaussian","section":"Concepts","tags":["statistics"],"searchText":"gaussian a common distribution that appears in sensor noise and estimation. statistics core idea ## core idea the gaussian distribution is useful because it is analytically tractable and often a good local approximation."},{"title":"Bayes","href":"/concepts/probability/bayes/","path":"Concepts → Concepts → Probability → Bayes","section":"Concepts","tags":["statistics"],"searchText":"bayes the rule for updating belief when new evidence arrives. statistics core idea ## core idea bayes' rule updates a prior belief with evidence to produce a posterior belief."},{"title":"Math for Robotics","href":"/courses/math-for-robotics/overview/","path":"Courses → Courses → Math for Robotics → Overview","section":"Courses","tags":[],"searchText":"math for robotics a working map for the mathematical tools used throughout robotics. why this course exists roadmap ## why this course exists this course exists to keep the mathematical structure of robotics in one place so it can be rebuilt quickly when needed. roadmap week 01 week 02 assignments"},{"title":"Week 01","href":"/courses/math-for-robotics/week-01/","path":"Courses → Courses → Math for Robotics → Week 01","section":"Courses","tags":[],"searchText":"week 01 linear algebra and notation for robotics. focus ## focus ailure modes worth preserving. focus ## focus keep a record of drift, bad features, calibration mistakes, and numerical instability."},{"title":"ROS 2 CLI","href":"/cheatsheets/ros2-cli/","path":"Cheat Sheets → Cheat Sheets → ROS 2 CLI","section":"Cheat Sheets","tags":[],"searchText":"ros 2 cli common commands worth remembering when working in a ros 2 workspace. workspace nodes and topics services and actions ## workspace nodes and topics services and actions"},{"title":"Writing Template","href":"/templates/writing-template/","path":"Templates → Templates → Writing Template","section":"Templates","tags":[],"searchText":"writing template a template for turning notes into durable reference pages. purpose recommended structure example code example image import callout from '../../src/components/callout.astro'; import codeblock from '../../src/components/codeblock.astro'; import image from '../../src/components/image.astro'; purpose use this template when you want a page to survive long after the course or project context is gone. explain the idea once, then link to the permanent concept instead of repeating it everywhere. recommended structure 1. why it matters 2. core objects or definitions 3. example 4. common failure modes 5. further reading example code row.reduce((sum, value, j) => sum + value x[j], 0) );} /> example image"}];

  const input = document.querySelector('[data-search-input]');
  const resultsRoot = document.querySelector('[data-search-results]');
  const dataset = records.map((record) => ({
    ...record,
    titleLower: record.title.toLowerCase(),
    pathLower: record.path.toLowerCase(),
    sectionLower: record.section.toLowerCase(),
    tagsLower: record.tags.join(' ').toLowerCase(),
  }));

  const sections = ['Concepts', 'Courses', 'Projects', 'Papers', 'Cheat Sheets', 'Templates'];
  const state = {
    query: '',
    selectedIndex: 0,
    results: [],
  };

  const normalize = (value) => value.trim().toLowerCase().replace(/\s+/g, ' ');

  const scoreRecord = (record, terms) => {
    if (terms.length === 0) return 0;

    let score = 0;

    for (const term of terms) {
      if (!record.searchText.includes(term)) return -1;

      if (record.titleLower.startsWith(term)) score += 120;
      else if (record.titleLower.includes(term)) score += 80;

      if (record.pathLower.startsWith(term)) score += 50;
      else if (record.pathLower.includes(term)) score += 30;

      if (record.sectionLower.includes(term)) score += 20;
      if (record.tagsLower.includes(term)) score += 25;
      if (record.searchText.includes(term)) score += 8;
    }

    return score;
  };

  const search = (query) => {
    const normalized = normalize(query);
    if (!normalized) {
      return dataset
        .map((record, index) => ({ ...record, score: 0, index }))
        .sort((a, b) => sections.indexOf(a.section) - sections.indexOf(b.section) || a.path.localeCompare(b.path));
    }

    const terms = normalized.split(' ').filter(Boolean);

    return dataset
      .map((record, index) => ({ ...record, score: scoreRecord(record, terms), index }))
      .filter((record) => record.score >= 0)
      .sort((a, b) => {
        if (a.score !== b.score) return b.score - a.score;
        if (a.section !== b.section) return sections.indexOf(a.section) - sections.indexOf(b.section);
        return a.path.localeCompare(b.path);
      });
  };

  const updateUrl = (query) => {
    const url = new URL(window.location.href);
    if (query) {
      url.searchParams.set('q', query);
    } else {
      url.searchParams.delete('q');
    }
    history.replaceState({}, '', `${url.pathname}${url.search}`);
  };

  const render = () => {
    state.results = search(state.query);

    if (state.results.length === 0) {
      resultsRoot.innerHTML = '';
      return;
    }

    state.selectedIndex = Math.max(0, Math.min(state.selectedIndex, state.results.length - 1));

    const groups = [];
    let currentSection = '';

    state.results.forEach((record, displayIndex) => {
      if (record.section !== currentSection) {
        currentSection = record.section;
        groups.push(`<div class="mt-6 text-[0.86rem] font-medium text-[color:var(--faint)]">${currentSection}</div>`);
      }

      const active = displayIndex === state.selectedIndex;
      groups.push(`
        <a
          href="${record.href}"
          class="search-result mt-2 flex items-start gap-3 text-left outline-none"
          data-result-index="${displayIndex}"
          data-nav-link="true"
        >
          <span class="search-arrow mt-[0.1rem] w-[1ch] shrink-0 text-[color:var(--text)]">${active ? '>' : ''}</span>
          <span class="min-w-0">
            <span class="${active ? 'font-semibold text-[color:var(--text)]' : 'text-[color:var(--text)]'} block text-[1.08rem] leading-[1.55]">${record.title}</span>
            <span class="block text-[0.96rem] leading-[1.5] text-[color:var(--faint)]">${record.path}</span>
          </span>
        </a>
      `);
    });

    resultsRoot.innerHTML = groups.join('');
  };

  const openSelected = () => {
    const record = state.results[state.selectedIndex];
    if (!record) return;
    window.__wikiNavigate?.(record.href) ?? window.location.assign(record.href);
  };

  const applyQuery = (value) => {
    state.query = value;
    state.selectedIndex = 0;
    updateUrl(value);
    render();
  };

  const initialQuery = new URLSearchParams(window.location.search).get('q') ?? '';
  input.value = initialQuery;
  applyQuery(initialQuery);
  input.focus();

  input.addEventListener('input', () => {
    applyQuery(input.value);
  });

  input.addEventListener('keydown', (event) => {
    if (event.defaultPrevented) return;
    if (document.body.dataset.readingSettingsOpen === 'true') return;

    if (event.key === 'ArrowDown') {
      event.preventDefault();
      state.selectedIndex = Math.min(state.selectedIndex + 1, Math.max(state.results.length - 1, 0));
      render();
    }

    if (event.key === 'ArrowUp') {
      event.preventDefault();
      state.selectedIndex = Math.max(state.selectedIndex - 1, 0);
      render();
    }

    if (event.key === 'Enter') {
      event.preventDefault();
      openSelected();
    }

    if (event.key === 'Escape') {
      event.preventDefault();
      if (!window.__wikiGoBack?.()) {
        window.location.assign('/');
      }
    }
  });

  resultsRoot.addEventListener('pointerdown', () => {
    input.focus();
  });

  resultsRoot.addEventListener('mousemove', (event) => {
    const row = event.target instanceof Element ? event.target.closest('[data-result-index]') : null;
    if (!row) return;
    const index = Number(row.getAttribute('data-result-index'));
    if (Number.isNaN(index)) return;
    if (index === state.selectedIndex) return;
    state.selectedIndex = index;
    render();
  });

  resultsRoot.addEventListener('click', (event) => {
    const row = event.target instanceof Element ? event.target.closest('[data-result-index]') : null;
    if (!row) return;
    const index = Number(row.getAttribute('data-result-index'));
    if (Number.isNaN(index)) return;
    state.selectedIndex = index;
    render();
  });

    let state = normalizePomodoroState(readPomodoroState());
    let configMode = 'start';
    let selectedBreak = state.prefs.breakMinutes;
    let selectedFocusMode = ['25', '45', '60'].includes(String(state.prefs.focusMinutes))
      ? String(state.prefs.focusMinutes)
      : 'custom';
    let focusedCustomValue =
      selectedFocusMode === 'custom' ? String(state.prefs.focusMinutes) : String(defaultPomodoroPrefs.focusMinutes);
    let openDialog = null;
    let lastActiveElement = null;
    let timer = null;

    const isReadingPage = () => document.body.dataset.wikiPageKind === 'document';
    const isFocusMode = () => body.dataset.readingFocusMode === 'true';

    const syncState = () => {
      state = normalizePomodoroState(state);
      writePomodoroState(state);
      window.__wikiPomodoroSnapshot = () => getSnapshot();
      window.__wikiPomodoroHistory = () => state.history.slice(0, POMODORO_HISTORY_LIMIT);
      if (state.session && state.dialog?.kind !== 'completion') {
        startTimer();
      } else {
        stopTimer();
      }
      window.dispatchEvent(new CustomEvent('robotics:pomodoro-change'));
    };

    const getRunningRemaining = () => {
      if (!state.session) return null;
      if (state.session.pausedRemainingMs !== null) return state.session.pausedRemainingMs;
      return Math.max(0, state.session.phaseEndsAt - Date.now());
    };

    const getSnapshot = () => {
      if (state.dialog?.kind === 'setup') {
        return {
          status: 'setup',
          phase: null,
          dialogKind: 'setup',
          remainingMs: null,
          canStart: false,
          canPause: false,
          canResume: false,
          canEnd: false,
        };
      }

      if (state.dialog?.kind === 'completion') {
        return {
          status: 'completion',
          phase: state.dialog.phase,
          dialogKind: 'completion',
          remainingMs: null,
          canStart: false,
          canPause: false,
          canResume: false,
          canEnd: false,
        };
      }

      if (!state.session) {
        return {
          status: 'idle',
          phase: null,
          dialogKind: null,
          remainingMs: null,
          canStart: true,
          canPause: false,
          canResume: false,
          canEnd: false,
        };
      }

      const remainingMs = getRunningRemaining() ?? 0;

      if (state.session.pausedRemainingMs !== null) {
        return {
          status: 'paused',
          phase: state.session.phase,
          dialogKind: null,
          remainingMs,
          canStart: false,
          canPause: false,
          canResume: true,
          canEnd: true,
        };
      }

      return {
        status: 'running',
        phase: state.session.phase,
        dialogKind: null,
        remainingMs,
        canStart: false,
        canPause: true,
        canResume: false,
        canEnd: true,
      };
    };

    const setIndicator = () => {
      const snapshot = getSnapshot();
      let label = 'Focus';

      if (snapshot.status === 'running' || snapshot.status === 'paused') {
        const phaseLabel = state.session?.phase === 'break' ? 'Break' : 'Focus';
        label = `${phaseLabel} · ${formatPomodoroCountdown(snapshot.remainingMs ?? 0)}`;
      } else if (snapshot.status === 'setup' || snapshot.status === 'completion') {
        label = 'Focus';
      }

      if (isFocusMode() && (snapshot.status === 'running' || snapshot.status === 'paused')) {
        indicatorElement.textContent = label;
        indicatorElement.style.color = 'var(--faint)';
        indicatorElement.style.fontSize = '0.72rem';
        return;
      }

      if (isFocusMode() && snapshot.status === 'idle') {
        indicatorElement.textContent = 'Focus';
        indicatorElement.style.color = 'var(--faint)';
        indicatorElement.style.fontSize = '0.72rem';
        return;
      }

      if (snapshot.status === 'idle') {
        indicatorElement.textContent = 'Focus';
      } else if (snapshot.status === 'paused') {
        indicatorElement.textContent = label;
      } else if (snapshot.status === 'running') {
        indicatorElement.textContent = label;
      } else {
        indicatorElement.textContent = label;
      }
    };

    const setButtonState = (button, active) => {
      button.dataset.active = active ? 'true' : 'false';
    };

    const updatePresetButtons = () => {
      const focusButtons = Array.from(focusOptionsElement.querySelectorAll('[data-pomodoro-focus-option]'));
      focusButtons.forEach((button) => {
        const value = button.getAttribute('data-value');
        const active = value === selectedFocusMode || (selectedFocusMode === 'custom' && value === 'custom');
        setButtonState(button, active);
      });

      const breakButtons = Array.from(breakOptionsElement.querySelectorAll('[data-pomodoro-break-option]'));
      breakButtons.forEach((button) => {
        const value = button.getAttribute('data-value');
        setButtonState(button, value === String(selectedBreak));
      });
    };

    const setConfigMode = (mode) => {
      configMode = mode;
      configTitleElement.textContent = mode === 'settings' ? 'Pomodoro Settings' : 'Start Focus Session';
      configConfirmElement.textContent = mode === 'settings' ? 'Save' : 'Start';
    };

    const isActivationSuppressed = () => performance.now() < (window.__wikiPomodoroSuppressActivationUntil || 0);

    const setConfigSelection = (focusMinutes, breakMinutes) => {
      selectedBreak = breakMinutes;
      selectedFocusMode = ['25', '45', '60'].includes(String(focusMinutes)) ? String(focusMinutes) : 'custom';
      focusedCustomValue = String(focusMinutes);
      focusCustomElement.hidden = selectedFocusMode !== 'custom';
      focusCustomElement.value = focusedCustomValue;
      updatePresetButtons();
      writePomodoroState(state);
    };

    const renderConfig = () => {
      focusCustomElement.hidden = selectedFocusMode !== 'custom';
      focusCustomElement.value = focusedCustomValue;
      updatePresetButtons();
      configLayerElement.hidden = false;
      openDialog = 'config';
      lastActiveElement = document.activeElement;
      configConfirmElement.focus?.();
    };

    const closeConfig = () => {
      configLayerElement.hidden = true;
      openDialog = null;
      if (lastActiveElement instanceof HTMLElement) {
        lastActiveElement.focus?.();
      }
    };

    const updateSessionControls = () => {
      const snapshot = getSnapshot();
      if (!state.session) return;

      const phaseLabel = state.session.phase === 'break' ? 'Break' : 'Focus';
      const remainingLabel =
        snapshot.status === 'paused' ? 'Paused' : formatPomodoroCountdown(snapshot.remainingMs ?? 0);
      sessionTitleElement.textContent = `${phaseLabel} · ${remainingLabel}`;

      const paused = snapshot.status === 'paused';
      const isBreak = state.session.phase === 'break';
      sessionPrimaryElement.textContent = paused ? 'Resume' : 'Pause';
      sessionSkipElement.hidden = !isBreak;
      sessionSkipElement.textContent = 'Skip Break';
      sessionEndElement.textContent = 'End Session';
      sessionCloseElement.textContent = 'Close';
    };

    const renderSessionControls = () => {
      if (!state.session) return;
      updateSessionControls();
      sessionLayerElement.hidden = false;
      openDialog = 'session';
      lastActiveElement = document.activeElement;
      sessionPrimaryElement.focus?.();
    };

    const closeSessionControls = (restoreFocus = true) => {
      sessionLayerElement.hidden = true;
      if (openDialog === 'session') {
        openDialog = null;
      }
      if (restoreFocus && lastActiveElement instanceof HTMLElement) {
        lastActiveElement.focus?.();
      }
    };

    const renderCompletion = () => {
      const phase = state.dialog?.kind === 'completion' ? state.dialog.phase : 'focus';
      completeTitleElement.textContent =
        phase === 'focus' ? '✓ Focus complete' : '✓ Break complete';
      completePrimaryElement.hidden = phase !== 'focus';
      completePrimaryElement.textContent = phase === 'focus' ? 'Start Break' : 'Start Focus';
      completeActionsElement.style.gap = '0.5rem';
      completeLayerElement.hidden = false;
      openDialog = 'completion';
      lastActiveElement = document.activeElement;
      (phase === 'focus' ? completePrimaryElement : completeDismissElement).focus?.();
    };

    const closeCompletion = () => {
      completeLayerElement.hidden = true;
      openDialog = null;
      if (lastActiveElement instanceof HTMLElement) {
        lastActiveElement.focus?.();
      }
    };

    const pushHistory = (completed, cancelled, endedPhase) => {
      const now = Date.now();
      const session = state.session;
      if (!session) return;

      const entry = createPomodoroHistoryEntry({
        date: now,
        focusMinutes: session.focusMinutes,
        breakMinutes: session.breakMinutes,
        pagesVisited: session.pagesVisited,
        completed,
        cancelled,
        endedPhase,
      });

      state.history = trimPomodoroHistory([entry, ...state.history]);
    };

    const recordPageVisit = () => {
      const session = state.session;
      if (!session || state.dialog?.kind === 'setup') return;
      if (!isReadingPage()) return;

      const href = `${window.location.pathname}${window.location.search}`;
      const title = document.body.dataset.wikiPageTitle || document.title.replace(/\s*·\s*Robotics Wiki\s*$/, '').trim();
      const path = document.body.dataset.wikiPagePath || '';
      if (!href || !title) return;

      if (session.pagesVisited.some((page) => page.href === href)) return;
      session.pagesVisited.unshift(buildPomodoroPageVisit({ href, title, path }));
      state.session = session;
    };

    const save = () => {
      writePomodoroState(state);
      syncState();
      setIndicator();
    };

    const clearSession = () => {
      state.session = null;
    };

    const finishCurrentPhaseIfNeeded = () => {
      if (!state.session || state.session.pausedRemainingMs !== null) return;
      const now = Date.now();
      if (now < state.session.phaseEndsAt) return;

      if (state.session.phase === 'focus') {
        state.session.pausedRemainingMs = null;
        state.dialog = { kind: 'completion', phase: 'focus' };
        state.session.phaseEndsAt = now;
        state.session.phaseStartedAt = now;
      } else {
        pushHistory(true, false, 'break');
        clearSession();
        state.dialog = { kind: 'completion', phase: 'break' };
      }
    };

    const tick = () => {
      finishCurrentPhaseIfNeeded();
      save();
      if (state.dialog?.kind === 'completion') {
        if (openDialog === 'session') {
          closeSessionControls(false);
        }
        if (openDialog !== 'completion') {
          openCompletion();
        } else {
          renderCompletion();
        }
        return;
      }

      if (openDialog === 'session') {
        updateSessionControls();
      }
    };

    const startTimer = () => {
      if (timer) return;
      timer = window.setInterval(tick, 1000);
    };

    const stopTimer = () => {
      if (!timer) return;
      window.clearInterval(timer);
      timer = null;
    };

    const openSetup = (mode) => {
      if (state.dialog?.kind === 'completion') return;
      window.__wikiPomodoroSuppressKeydownUntil = performance.now() + 250;
      window.__wikiPomodoroSuppressActivationUntil = performance.now() + 250;
      setConfigMode(mode);
      setConfigSelection(state.prefs.focusMinutes, state.prefs.breakMinutes);
      state.dialog = { kind: 'setup', mode, focusMinutes: state.prefs.focusMinutes, breakMinutes: state.prefs.breakMinutes };
      syncState();
      renderConfig();
    };

    const openTimerDialog = () => {
      if (state.session) {
        renderSessionControls();
        return;
      }

      openSetup('start');
    };

    const openCompletion = () => {
      if (state.dialog?.kind !== 'completion') return;
      syncState();
      renderCompletion();
    };

    const dismissCompletion = () => {
      const phase = state.dialog?.kind === 'completion' ? state.dialog.phase : 'focus';

      if (phase === 'focus' && state.session) {
        pushHistory(true, false, 'focus');
        clearSession();
      }

      state.dialog = null;
      syncState();
      closeCompletion();
      setIndicator();
    };

    const beginSession = () => {
      const focusMinutes = selectedFocusMode === 'custom' ? Number(focusedCustomValue) || state.prefs.focusMinutes : Number(selectedFocusMode);
      const breakMinutes = selectedBreak;

      state.prefs = { focusMinutes, breakMinutes };
      state.session = {
        id: globalThis.crypto?.randomUUID?.() ?? `${Date.now()}-${Math.random().toString(16).slice(2)}`,
        startedAt: Date.now(),
        phase: 'focus',
        phaseStartedAt: Date.now(),
        phaseEndsAt: Date.now() + focusMinutes * 60 * 1000,
        pausedRemainingMs: null,
        pagesVisited: [],
        focusMinutes,
        breakMinutes,
      };
      state.dialog = null;
      syncState();
      recordPageVisit();
      closeConfig();
      startTimer();
      setIndicator();
    };

    const saveSettings = () => {
      const focusMinutes = selectedFocusMode === 'custom' ? Number(focusedCustomValue) || state.prefs.focusMinutes : Number(selectedFocusMode);
      const breakMinutes = selectedBreak;

      state.prefs = { focusMinutes, breakMinutes };
      state.dialog = null;
      syncState();
      closeConfig();
    };

    const pauseTimer = () => {
      if (!state.session || state.session.pausedRemainingMs !== null || state.dialog) return;
      state.session.pausedRemainingMs = Math.max(0, state.session.phaseEndsAt - Date.now());
      syncState();
      setIndicator();
      if (openDialog === 'session') {
        updateSessionControls();
      }
    };

    const resumeTimer = () => {
      if (!state.session || state.session.pausedRemainingMs === null || state.dialog) return;
      const remaining = state.session.pausedRemainingMs;
      state.session.pausedRemainingMs = null;
      state.session.phaseEndsAt = Date.now() + remaining;
      syncState();
      setIndicator();
      if (openDialog === 'session') {
        updateSessionControls();
      }
    };

    const endSession = () => {
      if (!state.session) return;
      const endedPhase = state.session.phase;
      pushHistory(false, true, endedPhase);
      state.session = null;
      state.dialog = null;
      syncState();
      closeSessionControls(false);
      closeConfig();
      closeCompletion();
      setIndicator();
    };

    const startBreak = () => {
      if (!state.session || state.dialog?.kind !== 'completion' || state.dialog.phase !== 'focus') return;
      state.dialog = null;
      state.session.phase = 'break';
      state.session.phaseStartedAt = Date.now();
      state.session.phaseEndsAt = Date.now() + state.session.breakMinutes * 60 * 1000;
      state.session.pausedRemainingMs = null;
      syncState();
      closeCompletion();
      startTimer();
      setIndicator();
    };

    const skipBreak = () => {
      if (!state.session || state.session.phase !== 'break') return;
      state.session.phase = 'focus';
      state.session.phaseStartedAt = Date.now();
      state.session.phaseEndsAt = Date.now() + state.session.focusMinutes * 60 * 1000;
      state.session.pausedRemainingMs = null;
      syncState();
      closeSessionControls(false);
      startTimer();
      setIndicator();
    };

    const cancelConfig = () => {
      state.dialog = null;
      syncState();
      closeConfig();
    };

    settingsTriggerElement.addEventListener('click', () => {
      openTimerDialog();
    });

    const onKeydown = (event) => {
      if (performance.now() < (window.__wikiPomodoroSuppressKeydownUntil || 0)) {
        return;
      }
      if (isActivationSuppressed()) {
        return;
      }

      if (openDialog === 'config') {
        if (event.key === 'Escape') {
          event.preventDefault();
          event.stopImmediatePropagation();
          cancelConfig();
          return;
        }

        if (event.key === 'Enter') {
          event.preventDefault();
          event.stopImmediatePropagation();
          if (configMode === 'settings') {
            saveSettings();
          } else {
            beginSession();
          }
        }
      }

      if (openDialog === 'completion') {
        if (event.key === 'Escape') {
          event.preventDefault();
          event.stopImmediatePropagation();
          dismissCompletion();
        }
      }
    };

    focusOptionsElement.addEventListener('click', (event) => {
      const target = event.target;
      if (!(target instanceof Element)) return;
      const button = target.closest('[data-pomodoro-focus-option]');
      if (!(button instanceof HTMLElement)) return;
      const value = button.getAttribute('data-value');
      if (!value) return;

      selectedFocusMode = value;
      if (value === 'custom') {
        focusCustomElement.hidden = false;
        focusCustomElement.focus?.();
        focusedCustomValue = String(focusCustomElement.value || state.prefs.focusMinutes || defaultPomodoroPrefs.focusMinutes);
      } else {
        focusCustomElement.hidden = true;
        focusedCustomValue = value;
      }
      updatePresetButtons();
      syncState();
    });

    breakOptionsElement.addEventListener('click', (event) => {
      const target = event.target;
      if (!(target instanceof Element)) return;
      const button = target.closest('[data-pomodoro-break-option]');
      if (!(button instanceof HTMLElement)) return;
      const value = button.getAttribute('data-value');
      if (!value) return;

      selectedBreak = Number(value);
      updatePresetButtons();
      syncState();
    });

    focusCustomElement.addEventListener('input', () => {
      focusedCustomValue = focusCustomElement.value;
      syncState();
    });

    configOverlay.addEventListener('click', () => {
      if (isActivationSuppressed()) return;
      cancelConfig();
    });
    configCancelElement.addEventListener('click', () => {
      if (isActivationSuppressed()) return;
      cancelConfig();
    });
    configConfirmElement.addEventListener('click', () => {
      if (isActivationSuppressed()) return;
      if (configMode === 'settings') {
        saveSettings();
      } else {
        beginSession();
      }
    });

    completeOverlay.addEventListener('click', () => {
      if (isActivationSuppressed()) return;
      dismissCompletion();
    });
    completeDismissElement.addEventListener('click', () => {
      if (isActivationSuppressed()) return;
      dismissCompletion();
    });
    completePrimaryElement.addEventListener('click', () => {
      if (isActivationSuppressed()) return;
      if (state.dialog?.kind !== 'completion') return;
      if (state.dialog.phase === 'focus') {
        startBreak();
      } else {
        beginSession();
      }
    });

    sessionOverlayElement.addEventListener('click', () => {
      closeSessionControls();
    });
    sessionPrimaryElement.addEventListener('click', () => {
      if (!state.session) return;
      if (state.session.pausedRemainingMs !== null) {
        resumeTimer();
        return;
      }
      pauseTimer();
    });
    sessionSkipElement.addEventListener('click', () => {
      skipBreak();
    });
    sessionEndElement.addEventListener('click', () => {
      endSession();
    });
    sessionCloseElement.addEventListener('click', () => {
      closeSessionControls();
    });

    window.addEventListener('keydown', onKeydown, true);
    window.addEventListener('robotics:pomodoro-change', () => {
      setIndicator();
    });
    window.addEventListener('robotics:reading-settings-change', () => {
      setIndicator();
    });

    window.__wikiPomodoroSnapshot = () => getSnapshot();
    window.__wikiPomodoroHistory = () => state.history.slice(0, POMODORO_HISTORY_LIMIT);
    window.__wikiOpenPomodoroSetup = () => openSetup('start');
    window.__wikiOpenPomodoroSettings = () => openSetup('settings');
    window.__wikiPomodoroPause = pauseTimer;
    window.__wikiPomodoroResume = resumeTimer;
    window.__wikiPomodoroEndSession = endSession;
    window.__wikiPomodoroDismissDialog = () => {
      if (state.dialog?.kind === 'completion') dismissCompletion();
      else cancelConfig();
    };
    window.__wikiPomodoroStartBreak = startBreak;
    window.__wikiPomodoroStartSession = beginSession;

    // Restore any in-progress session or visible dialog.
    finishCurrentPhaseIfNeeded();
    if (state.session) {
      recordPageVisit();
    }
    if (state.dialog?.kind === 'setup') {
      configMode = state.dialog.mode;
      selectedFocusMode = ['25', '45', '60'].includes(String(state.dialog.focusMinutes))
        ? String(state.dialog.focusMinutes)
        : 'custom';
      focusedCustomValue = String(state.dialog.focusMinutes);
      selectedBreak = state.dialog.breakMinutes;
      setConfigMode(state.dialog.mode);
      setConfigSelection(state.dialog.focusMinutes, state.dialog.breakMinutes);
      renderConfig();
    } else if (state.dialog?.kind === 'completion') {
      openCompletion();
    } else if (state.session) {
      startTimer();
    }

    setIndicator();
    syncState();
  }
